<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concurso del tema 3 · 0221 Montaje y mantenimiento</title>

<!-- Archivo autónomo: funciona abierto desde el disco o un USB, sin conexión.
     Se proyecta en clase; el profesor marca quién responde. Estado guardado en localStorage. -->
<style>
:root {
  --fondo: #1d2b36; --fondo-2: #263a48; --tinta: #1b2733; --blanco: #ffffff;
  --acento: #17685e; --acento-claro: #e3f3ee; --suave: #5d6f80;
  --c0: #d01c3a; --c1: #1366c4; --c2: #a87300; --c3: #24800c;
  --ok: #1d8a4a; --mal: #c0262f; --oro: #e2a400; --plata: #9aa6b2; --bronce: #b8733a;
  --radio: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Segoe UI", Calibri, system-ui, sans-serif; background: var(--fondo); color: var(--blanco); font-size: clamp(15px, 1.15vw, 20px); }
button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: .6em 1.1em; font-weight: 700; }
button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #ffb347; outline-offset: 3px; }
.principal { background: var(--blanco); color: var(--tinta); font-size: 1.1em; box-shadow: 0 4px 0 #9fb0bf; }
.principal:active { transform: translateY(2px); box-shadow: 0 2px 0 #9fb0bf; }
.sec { background: transparent; color: var(--blanco); border: 2px solid rgba(255,255,255,.55); }
.sec:hover { background: rgba(255,255,255,.1); }
.peligro { background: transparent; color: #ffb4b8; border: 2px solid #ffb4b8; }
#app { min-height: 100%; display: flex; flex-direction: column; }

/* Barra superior */
.barra { display: flex; align-items: center; justify-content: space-between; gap: .8em; flex-wrap: wrap; padding: .6em 1.2em; background: rgba(0,0,0,.25); }
.barra .estado { font-weight: 700; }
.barra .estado small { font-weight: 400; opacity: .8; margin-left: .5em; }
.barra-acciones { display: flex; gap: .4em; flex-wrap: wrap; }
.barra-acciones button { padding: .35em .7em; font-size: .85em; }

/* Configuración */
.config { max-width: 64rem; width: 100%; margin: 0 auto; padding: 2em 1.2em 3em; }
.config h1 { font-size: clamp(2em, 4vw, 3.2em); margin: 0; letter-spacing: -.02em; }
.config .sub { margin: .2em 0 1.5em; opacity: .85; }
.config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1em; }
.panel { background: var(--blanco); color: var(--tinta); border-radius: var(--radio); padding: 1.1em 1.2em; }
.panel h2 { margin: 0 0 .6em; font-size: 1.15em; color: var(--acento); }
.panel label { display: block; }
.panel textarea { width: 100%; font: inherit; padding: .6em; border: 1px solid #9aabbb; border-radius: 6px; resize: vertical; min-height: 12em; }
.panel select { font: inherit; padding: .3em .4em; border-radius: 6px; border: 1px solid #9aabbb; }
.panel .nota { font-size: .85em; color: var(--suave); margin: .4em 0 0; }
.opcion-modo { display: flex; gap: .6em; align-items: flex-start; padding: .55em .6em; border: 2px solid #d6dee6; border-radius: 8px; margin-bottom: .5em; cursor: pointer; }
.opcion-modo:has(input:checked) { border-color: var(--acento); background: var(--acento-claro); }
.opcion-modo input { margin-top: .3em; }
.opcion-modo span { display: block; font-size: .85em; color: var(--suave); }
.fila-ajuste { display: flex; justify-content: space-between; align-items: center; gap: .6em; margin: .55em 0; flex-wrap: wrap; }
.panel .sec { color: var(--acento); border-color: var(--acento); margin-top: .6em; }
.ayuda { margin: 1em 0; background: var(--fondo-2); border-radius: var(--radio); padding: .2em 1.2em; }
.ayuda summary { cursor: pointer; font-weight: 700; padding: .7em 0; }
.ayuda li + li { margin-top: .35em; }
.premios-linea { display: flex; gap: 1em; flex-wrap: wrap; align-items: center; margin: 1.2em 0; font-size: 1.1em; }
.premio { background: var(--fondo-2); border-radius: 2em; padding: .35em .9em; }
.error { color: #ffb4b8; font-weight: 700; min-height: 1.4em; }

/* Pregunta */
.escenario { flex: 1; display: grid; grid-template-rows: auto auto 1fr; gap: 1em; padding: 1em 1.2em; }
.enunciado { background: var(--blanco); color: var(--tinta); border-radius: var(--radio); padding: .8em 1em; text-align: center; font-size: clamp(1.4em, 2.6vw, 2.5em); font-weight: 700; line-height: 1.25; margin: 0; }
.centro { display: flex; align-items: center; justify-content: center; gap: 2em; flex-wrap: wrap; }
.reloj { --p: 1; width: 5.2em; height: 5.2em; border-radius: 50%; display: grid; place-items: center; font-size: clamp(1.1em, 1.6vw, 1.6em); font-weight: 800;
  background: radial-gradient(closest-side, var(--fondo) 79%, transparent 80% 100%), conic-gradient(var(--blanco) calc(var(--p) * 360deg), rgba(255,255,255,.15) 0); }
.reloj.agotado { background: var(--mal); font-size: clamp(.9em, 1.2vw, 1.2em); text-align: center; line-height: 1.1; padding: .4em; }
.reloj.pausado { opacity: .55; }
.contador { font-size: 1.2em; text-align: center; }
.contador strong { display: block; font-size: 2em; line-height: 1; }
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; align-content: stretch; }
.opcion { display: flex; align-items: center; gap: .8em; border-radius: var(--radio); padding: .7em 1em; font-size: clamp(1.1em, 1.9vw, 1.9em); font-weight: 700; color: var(--blanco); min-height: 3.2em; box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
.opcion svg { width: 1.5em; height: 1.5em; flex: none; fill: var(--blanco); }
.opcion .num { flex: none; width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.22); font-size: .8em; }
.opcion .texto { flex: 1; overflow-wrap: anywhere; }
.opcion .marca-ok { margin-left: auto; font-size: 1.3em; }
.c0 { background: var(--c0); } .c1 { background: var(--c1); } .c2 { background: var(--c2); } .c3 { background: var(--c3); }
.opcion.apagada { opacity: .28; transform: scale(.97); }
.opcion.correcta { outline: 5px solid var(--blanco); outline-offset: 3px; }
.explicacion { background: var(--blanco); color: var(--tinta); border-left: 8px solid var(--ok); border-radius: var(--radio); padding: .7em 1em; margin: 0; font-size: 1.15em; }

/* Mesa del profesor */
.mesa { background: rgba(0,0,0,.25); padding: .8em 1.2em 1em; }
.mesa-ayuda { margin: 0 0 .6em; font-size: .95em; opacity: .9; }
.chips { display: flex; flex-wrap: wrap; gap: .45em; }
.chip { display: inline-flex; align-items: center; gap: .45em; padding: .45em .8em; border-radius: 2em; background: var(--fondo-2); color: var(--blanco); border: 2px solid rgba(255,255,255,.25); font-weight: 600; }
.chip:hover:not(:disabled) { border-color: var(--blanco); }
.chip:disabled { cursor: default; opacity: .6; }
.chip .insignia { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 .3em; border-radius: 1em; background: rgba(255,255,255,.2); font-size: .8em; }
.chip.respondido { background: var(--blanco); color: var(--tinta); border-color: var(--blanco); }
.chip.respondido .insignia { background: var(--fondo); color: var(--blanco); }
.chip.turno { background: #ffb347; color: var(--tinta); border-color: #ffb347; animation: latido 1s infinite; }
.chip.bloqueado { opacity: .45; text-decoration: line-through; }
.chip.ok { background: var(--ok); border-color: var(--ok); color: var(--blanco); }
.chip.fallo { background: var(--mal); border-color: var(--mal); color: var(--blanco); }
.chip.ok .insignia, .chip.fallo .insignia { background: rgba(0,0,0,.25); color: var(--blanco); }
@keyframes latido { 50% { box-shadow: 0 0 0 6px rgba(255,179,71,.35); } }
@media (prefers-reduced-motion: reduce) { .chip.turno { animation: none; } .opcion { transition: none; } }
.mesa-botones { display: flex; gap: .5em; flex-wrap: wrap; justify-content: flex-end; margin-top: .8em; align-items: center; }
.mesa-botones .si { background: var(--ok); color: var(--blanco); }
.mesa-botones .no { background: var(--mal); color: var(--blanco); }
.mesa-botones .aviso-turno { margin-right: auto; font-weight: 700; color: #ffcf8a; }

/* Marcador */
.marcador { flex: 1; width: 100%; max-width: 56rem; margin: 0 auto; padding: 1.5em 1.2em; }
.marcador h2 { text-align: center; font-size: clamp(1.6em, 3vw, 2.6em); margin: 0 0 .8em; }
.fila-marcador { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: .8em; background: var(--blanco); color: var(--tinta); border-radius: 10px; padding: .55em .9em; margin-bottom: .5em; font-size: 1.25em; position: relative; overflow: hidden; }
.fila-marcador .barra-pts { position: absolute; inset: 0 auto 0 0; background: var(--acento-claro); z-index: 0; }
.fila-marcador > *:not(.barra-pts) { position: relative; z-index: 1; }
.fila-marcador .pos { font-weight: 800; color: var(--acento); }
.fila-marcador .nom { font-weight: 700; overflow-wrap: anywhere; }
.fila-marcador .pts { font-weight: 800; text-align: right; }
.fila-marcador .delta { display: block; font-size: .65em; color: var(--ok); font-weight: 700; }
.fila-marcador .sube { color: var(--ok); font-size: .7em; margin-left: .4em; }
.resto { margin-top: 1em; }
.resto summary { cursor: pointer; font-weight: 700; }
.resto ol { columns: 2 14em; }
.pie-acciones { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin-top: 1.5em; }

/* Podio */
.podio-zona { flex: 1; padding: 1.2em; max-width: 64rem; width: 100%; margin: 0 auto; }
.podio-zona h2 { text-align: center; font-size: clamp(1.8em, 3.4vw, 3em); margin: 0 0 .5em; }
.podio { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: .8em; max-width: 46rem; margin: 0 auto; }
.peana { text-align: center; }
.peana .quien { font-size: clamp(1.1em, 2vw, 1.8em); font-weight: 800; overflow-wrap: anywhere; }
.peana .cuantos { opacity: .85; margin-bottom: .4em; }
.peana .bloque { border-radius: 10px 10px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15em; font-size: clamp(2em, 4vw, 3.6em); font-weight: 900; color: var(--tinta); }
.peana.p1 .bloque { height: min(11em, 34vh); background: var(--oro); } .peana.p2 .bloque { height: min(8em, 25vh); background: var(--plata); } .peana.p3 .bloque { height: min(5.5em, 17vh); background: var(--bronce); }
.peana .bloque small { display: block; font-size: .32em; font-weight: 800; background: var(--blanco); border-radius: 2em; padding: .2em .8em; line-height: 1.4; }
.aviso-empate { max-width: 46rem; margin: 1.2em auto 0; background: #ffb347; color: var(--tinta); border-radius: var(--radio); padding: .8em 1em; font-weight: 600; text-align: center; }

/* Tarjetas para imprimir: solo se ven al imprimir */
#hoja-tarjetas { display: none; }
@media print {
  @page { size: A4; margin: 10mm; }
  body { background: white; color: black; font-size: 12pt; }
  body.imprimir-tarjetas #app { display: none; }
  body.imprimir-tarjetas #hoja-tarjetas { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 190mm; height: 277mm; }
  .tarjeta-imp { border: 1px dashed #777; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tarjeta-imp svg { width: 55mm; height: 55mm; }
  .tarjeta-imp .n { font-size: 40pt; font-weight: 900; }
  .tarjeta-imp .p { font-size: 9pt; color: #555; }
  body:not(.imprimir-tarjetas) .barra, body:not(.imprimir-tarjetas) .pie-acciones, body:not(.imprimir-tarjetas) .mesa-botones { display: none !important; }
  body:not(.imprimir-tarjetas) .fila-marcador, body:not(.imprimir-tarjetas) .peana .bloque { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

@media (max-width: 640px) {
  .opciones { grid-template-columns: 1fr; }
  .podio { gap: .4em; }
  .peana.p1 .bloque { height: 8em; } .peana.p2 .bloque { height: 6em; } .peana.p3 .bloque { height: 4em; }
  .fila-marcador { font-size: 1.05em; }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="hoja-tarjetas" aria-hidden="true"></div>
<noscript><p style="padding:2em">Este concurso necesita JavaScript.</p></noscript>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------ preguntas
     o: opciones (2 o 4), c: índice de la correcta, e: explicación, t: segundos mínimos */
  var Q = [
    /* 3.1 La placa base y sus formatos */
    { p: '¿Qué fija el factor de forma de una placa base?', o: ['Tamaño, anclajes, panel trasero y conector de alimentación', 'Solo el número de ranuras de memoria', 'El zócalo del procesador', 'El chipset que lleva'], c: 0, e: 'Es la norma que permite que placas, cajas y fuentes de fabricantes distintos encajen entre sí.' },
    { p: '¿Qué formato tiene una placa de 305 × 244 mm?', o: ['Mini-ITX', 'Micro-ATX', 'ATX', 'E-ATX'], c: 2, e: 'ATX: 305 × 244 mm. Micro-ATX mide 244 × 244 y Mini-ITX, 170 × 170.' },
    { p: '¿Qué formato tiene una placa cuadrada de 244 × 244 mm?', o: ['Micro-ATX', 'ATX', 'Mini-ITX', 'BTX'], c: 0, e: 'Micro-ATX: tan ancha como una ATX pero más corta. Hasta 4 ranuras de expansión.' },
    { p: '¿Cuántas ranuras de expansión tiene una placa Mini-ITX?', o: ['4', '2', '7', '1'], c: 3, e: 'Una sola, normalmente la x16 para la tarjeta gráfica.' },
    { p: 'Una caja admite como formato máximo ATX. ¿Qué placa NO cabe?', o: ['Micro-ATX', 'E-ATX', 'Mini-ITX', 'ATX'], c: 1, e: 'Una caja admite su formato y los más pequeños. E-ATX es más grande que ATX.' },
    { p: '¿Qué tensión da la fuente ATX aunque el equipo esté apagado, para que la placa pueda ordenar el encendido?', o: ['12 V', '3,3 V', '5VSB', '–12 V'], c: 2, e: '5VSB (5 V de reposo, standby). Por eso el encendido es por software y se puede encender desde el teclado o la red.' },
    { p: '¿Qué formato antiguo tenía dos conectores de alimentación (P8 y P9) fáciles de poner al revés?', o: ['AT', 'ATX', 'Mini-ITX', 'Micro-ATX'], c: 0, e: 'AT y Baby-AT (1984-1985). ATX lo resolvió con un único conector con muesca.' },

    /* 3.2.1 Conectores internos */
    { p: '¿Cuántos pines tiene el conector principal de alimentación de una placa actual?', o: ['8', '19', '24 (20+4)', '4+4'], c: 2, e: 'ATX_PWR: 24 pines con 3,3 V, 5 V y 12 V para toda la placa.' },
    { p: '¿Qué lleva el conector EPS (CPU_PWR, ATX12V) de 4+4 u 8 pines?', o: ['Solo 12 V para el VRM del procesador', '3,3 V, 5 V y 12 V para toda la placa', '5 V para la iluminación', 'La señal del botón de encendido'], c: 0, e: 'El VRM convierte esos 12 V en la tensión de los núcleos. Las placas potentes llevan dos.' },
    { p: 'El conector USB interno azul de 19 pines sirve para…', o: ['dos USB 2.0 frontales', 'dos USB-A de 5 Gbit/s frontales', 'un USB-C frontal', 'el audio frontal'], c: 1, e: 'Es el USB 3.x interno. El de USB 2.0 tiene 9 pines y el USB-C frontal usa su propio conector.' },
    { p: '¿Cuántos pines tiene el conector USB 2.0 interno?', o: ['4', '9', '19', '24'], c: 1, e: '9 pines (10 posiciones, una sin pin) para dos puertos USB 2.0.' },
    { p: '¿Qué se conecta en HD_AUDIO (o AAFP)?', o: ['Los altavoces traseros', 'La tarjeta de sonido', 'Auriculares y micrófono del panel frontal', 'El altavoz de pitidos'], c: 2, e: 'Es el audio frontal de la caja.' },
    { p: '¿Dónde conectas el ventilador del disipador del procesador?', o: ['SYS_FAN', 'CHA_FAN', 'AIO_PUMP', 'CPU_FAN'], c: 3, e: 'CPU_FAN. Muchas placas avisan o no arrancan si no detectan ventilador ahí.' },
    { p: '¿Se puede conectar una tira ARGB (3 pines, 5 V) a un conector RGB (4 pines, 12 V)?', o: ['Sí', 'No'], c: 1, e: 'Son incompatibles: distinta tensión y distinta forma de controlar los LED. Con 12 V la tira ARGB se puede estropear.' },
    { p: '¿Qué hace el puente CLR_CMOS (CLRTC, JBAT1)?', o: ['Actualiza la UEFI', 'Apaga la placa', 'Activa el TPM', 'Devuelve la UEFI a los valores de fábrica'], c: 3, e: 'Borra los ajustes guardados. El firmware no cambia.' },
    { p: '¿Para qué sirve el conector SPEAKER (BUZZER)?', o: ['Para los altavoces del monitor', 'Para los pitidos de diagnóstico al arrancar', 'Para el audio frontal', 'Para el micrófono'], c: 1, e: 'El altavoz interno da códigos de pitidos cuando el arranque falla.' },

    /* 3.2.2 Panel frontal */
    { p: 'En el panel frontal (F_PANEL), ¿qué cables tienen polaridad?', o: ['Los botones', 'Los LED', 'Todos', 'Ninguno'], c: 1, e: 'Los LED tienen + y –. Los botones solo cierran un contacto.' },
    { p: '¿Qué pasa si conectas al revés el LED de encendido?', o: ['Se quema el LED', 'La placa no arranca', 'No se enciende, pero no se rompe', 'Se produce un cortocircuito'], c: 2, e: 'Un LED al revés no conduce: basta con darle la vuelta.' },
    { p: 'Sin botón de encendido, ¿qué dos pines se tocan un instante con un destornillador aislado?', o: ['RESET', 'PWR_LED', 'HDD_LED', 'PWR_SW'], c: 3, e: 'PWR_SW: es exactamente lo que hace el botón, cerrar ese contacto.' },
    { p: 'En la distribución habitual de Intel, ¿en qué pin va HDD_LED +?', o: ['1', '2', '5', '9'], c: 0, e: 'Fila de impares: HDD_LED + (1), HDD_LED – (3), RESET (5 y 7). Comprueba siempre la serigrafía.' },
    { p: '¿Por qué hay que mirar la serigrafía o el manual antes de conectar el panel frontal?', o: ['Porque los cables vienen sin nombre', 'Porque cada fabricante puede cambiar la distribución', 'Porque cambia con el procesador', 'Porque depende de la fuente'], c: 1, e: 'La distribución de Intel es la más extendida, pero no es obligatoria.' },

    /* 3.3.1 Características del procesador */
    { p: 'Un procesador de 8 núcleos con SMT (o Hyper-Threading) atiende…', o: ['8 hilos', '4 hilos', '16 hilos', '32 hilos'], c: 2, e: 'Cada núcleo atiende dos hilos: 8 × 2 = 16.' },
    { p: 'En los procesadores Intel, los núcleos E son…', o: ['núcleos de la gráfica', 'núcleos de emergencia', 'núcleos externos', 'núcleos de eficiencia'], c: 3, e: 'Intel mezcla núcleos de rendimiento (P) y de eficiencia (E).' },
    { p: '¿Por qué no basta con comparar la frecuencia turbo de un Intel y un AMD?', o: ['Porque la turbo nunca se alcanza', 'Porque cada uno mide los GHz de una forma', 'Porque el trabajo por ciclo (IPC) es distinto', 'Porque AMD no tiene turbo'], c: 2, e: 'Un procesador puede hacer más trabajo por ciclo que otro. Hay que mirar pruebas de rendimiento.' },
    { p: 'En AMD, el consumo máximo real (PPT) es 1,35 veces el TDP. Con un TDP de 65 W, el PPT es…', o: ['65 W', '88 W', '105 W', '130 W'], c: 1, e: '65 × 1,35 = 87,75 ≈ 88 W.', t: 30 },
    { p: 'La tensión de los núcleos (Vcore) de un procesador actual está entre…', o: ['3,3 y 5 V', '5 y 12 V', '12 y 24 V', '0,7 y 1,5 V'], c: 3, e: 'La genera el VRM de la placa a partir de los 12 V del conector EPS.' },
    { p: 'Hoy, la litografía («4 nm», «Intel 7»)…', o: ['es la medida exacta de cada transistor', 'es la frecuencia del procesador', 'es más un nombre comercial que una medida real', 'indica el tamaño del zócalo'], c: 2, e: 'Indica el proceso de fabricación; cuanto más avanzado, más transistores y menos consumo.' },
    { p: '¿Para qué sirve conocer el TDP de un procesador?', o: ['Para elegir el disipador y la fuente', 'Para saber su zócalo', 'Para elegir la memoria', 'Para saber cuántos núcleos tiene'], c: 0, e: 'Es el calor que hay que disipar y la potencia que consume.' },

    /* 3.3.2 Encapsulados y zócalos */
    { p: 'El zócalo AM4 de AMD es de tipo…', o: ['LGA', 'BGA', 'PGA', 'Slot'], c: 2, e: 'PGA: los pines están en el procesador. AM5 ya es LGA.' },
    { p: 'Un procesador de portátil normalmente va…', o: ['en un zócalo LGA', 'en un zócalo PGA', 'en un adaptador', 'soldado a la placa (BGA)'], c: 3, e: 'BGA: soldado con bolitas de estaño. No se puede cambiar.' },
    { p: '¿Qué zócalo usan los Intel Core de 12.ª, 13.ª y 14.ª generación?', o: ['LGA 1200', 'LGA 1700', 'LGA 1851', 'AM5'], c: 1, e: 'LGA 1700, con placas de las series 600 y 700, DDR4 o DDR5 según la placa.' },
    { p: '¿Qué memoria admite el zócalo AM5?', o: ['Solo DDR4', 'DDR4 o DDR5 según la placa', 'DDR3', 'Solo DDR5'], c: 3, e: 'AM5 es solo DDR5. La placa LGA 1700 es la que puede ser DDR4 o DDR5.' },

  /* ------------------------------------------------------------ cronómetro */
  function transcurrido() {
    var c = S.crono, ahora = Date.now();
    var pausa = c.pausado + (c.pausaDesde ? ahora - c.pausaDesde : 0);
    return Math.max(0, Math.min(c.limite, (ahora - c.inicio - pausa) / 1000));

  function reanudar() { if (S.crono.pausaDesde) { S.crono.pausado += Date.now() - S.crono.pausaDesde; S.crono.pausaDesde = null; } }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function iniciarReloj() { pararReloj(); reloj = setInterval(actualizarReloj, 100); actualizarReloj(); }
  function actualizarReloj() {
    if (S.fase !== 'pregunta' || !S.crono) { pararReloj(); return; }
    var resto = Math.max(0, S.crono.limite - transcurrido());
    var el = document.getElementById('reloj');
    if (el && !S.crono.agotado) {
      el.textContent = Math.ceil(resto);
      el.style.setProperty('--p', resto / S.crono.limite);
      el.classList.toggle('pausado', !!S.crono.pausaDesde);
    }
    if (resto <= 0 && !S.crono.agotado) {

  }

  function empezar() {

      var nombre = n; var k = 2;
      while (usados[nombre.toLowerCase()]) { nombre = n + ' (' + k++ + ')'; }

      return { id: 'j' + i, nombre: nombre, puntos: 0, aciertos: 0 };
    });
    var cfg = {
      modo: document.querySelector('input[name=modo]:checked').value,

      nPreg: parseInt(document.getElementById('npreg').value, 10),
      mezclar: document.getElementById('mezclar').checked
    };
    S = nuevo(cfg);
    S.jugadores = jugadores;
    var indices = Q.map(function (q, i) { return i; });
    if (cfg.mezclar) barajar(indices);
    S.cola = indices.slice(0, cfg.nPreg > 0 ? cfg.nPreg : indices.length);
    S.i = 0;
    preparar();
  }

  function preparar() {
    var q = pregunta();
    if (!q) { S.desempate = null; S.sinPreguntas = true; S.fase = 'podio'; guardar(); render(); return; }
    S.fase = 'pregunta';
    S.resp = {};
    S.mano = { turno: null, t: 0, bloq: [] };
    S.crono = { inicio: Date.now(), pausado: 0, pausaDesde: null, limite: Math.max(S.tiempo, q.t || 0), agotado: false };
    guardar(); render();
  }

  function pulsarChip(id) {
    var r = S.resp[id];
    if (S.fase === 'pregunta') {
      if (S.crono.agotado) return;
      if (modoMano()) {
        if (S.mano.bloq.indexOf(id) >= 0) return;
        if (S.mano.turno === id) { S.mano.turno = null; reanudar(); }
        else if (!S.mano.turno) { S.mano.turno = id; S.mano.t = transcurrido(); pausar(); }
      } else {
        if (!S.rapidez) return;
        if (r) {
          delete S.resp[id];
          Object.keys(S.resp).sort(function (a, b) { return S.resp[a].orden - S.resp[b].orden; })
            .forEach(function (k, i) { S.resp[k].orden = i + 1; });
        } else {
          S.resp[id] = { t: transcurrido(), orden: Object.keys(S.resp).length + 1, ok: true };

      }

      /* Corregir: sin marcar → acierto → fallo → sin marcar */
      if (!r) S.resp[id] = { t: S.crono.limite, orden: Object.keys(S.resp).length + 1, ok: true };
      else if (r.ok) r.ok = false;
      else delete S.resp[id];
    }
    guardar(); render();
  }

  function contestar(bien) {
    var id = S.mano.turno;
    if (!id) return;
    var orden = Object.keys(S.resp).length + 1;
    S.resp[id] = { t: S.mano.t, orden: orden, ok: bien };
    S.mano.turno = null;
    if (bien) { revelar(); return; }
    S.mano.bloq.push(id);
    reanudar();
    guardar(); render();
  }

  function revelar() {
    if (S.mano.turno) { S.mano.turno = null; }

    S.fase = 'revelada';
    pararReloj(); guardar(); render();
  }

  function cerrarPregunta() {
    if (S.desempate) {
      var ganadores = Object.keys(S.resp).filter(function (k) { return S.resp[k].ok; })

      S.reservaUsada++;
      if (ganadores.length) {
        var g = jug(ganadores[0]);
        g.puntos += 1; g.desempates = (g.desempates || 0) + 1;

    Object.keys(S.resp).forEach(function (id) {

  function empate() {
    var r = ranking();

        } else {
          if (r) { cls += ' respondido'; ins = r.orden + 'º'; etiqueta += ', ha respondido en ' + r.orden + 'º lugar'; }
          dis = S.crono.agotado || !S.rapidez;
        }
      } else {
        if (r && r.ok) { cls += ' ok'; ins = S.desempate ? '✓' : '+' + num(puntos(r)); etiqueta += ', acierto'; }
        else if (r) { cls += ' fallo'; ins = '✗'; etiqueta += ', fallo'; }
      }
      return '<button type="button" class="' + cls + '" data-chip="' + j.id + '"' + (dis ? ' disabled' : '') + ' aria-label="' + esc(etiqueta) + '">' +
        esc(j.nombre) + (ins ? '<span class="insignia">' + ins + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }

  function vistaPregunta() {
    var q = pregunta(), revelada = S.fase === 'revelada', ag = S.crono.agotado;
    var titulo = S.desempate ? 'Desempate' : 'Pregunta ' + (S.i + 1) + ' de ' + S.cola.length;
    var detalle = S.desempate ? 'por el ' + S.desempate.puesto + '.º puesto · gana quien acierte primero' : (modoMano() ? 'mano alzada' : 'todos responden');
    var nResp = Object.keys(S.resp).length;
    var centro = revelada
      ? (q.e ? '<p class="explicacion">' + esc(q.e) + '</p>' : '')
      : '<div class="centro"><div id="reloj" class="reloj' + (ag ? ' agotado' : '') + '" role="timer" aria-label="Tiempo restante">' + (ag ? '¡Tiempo!' : Math.ceil(S.crono.limite - transcurrido())) + '</div>' +
        (modoMano() ? '' : '<div class="contador"><strong>' + nResp + '</strong>' + (S.rapidez ? 'han respondido' : (ag ? '¡Tarjetas arriba!' : 'pensando…')) + '</div>') + '</div>';

    var ayuda, botones = '';
    if (!revelada) {
      if (modoMano()) {
        ayuda = S.mano.turno ? 'Escucha la respuesta de ' + esc(jug(S.mano.turno).nombre) + ' y pulsa Correcta o Incorrecta.' : 'Pulsa el nombre del primero que levante la mano. El tiempo se para mientras responde.';
        if (S.mano.turno) botones += '<span class="aviso-turno">Responde: ' + esc(jug(S.mano.turno).nombre) + '</span><button type="button" class="si" data-acc="correcta">✓ Correcta</button><button type="button" class="no" data-acc="incorrecta">✗ Incorrecta</button>';
      } else {
        ayuda = S.rapidez ? 'Pulsa el nombre de cada uno cuando levante su tarjeta. Si te equivocas, vuelve a pulsarlo.' : 'Cuando acabe el tiempo, todos levantan la tarjeta a la vez. Al revelar marcarás a quién acierta.';
      }
      botones += '<button type="button" class="sec" data-acc="mas10">+10 s</button>' +
        '<button type="button" class="principal" data-acc="revelar"' + (S.mano.turno ? '' : ' data-principal') + '>Revelar respuesta</button>';
    } else {
      ayuda = modoMano() ? 'Respuesta correcta: ' + (q.c + 1) + '. Pulsa un nombre para corregir si hace falta.'
        : 'Respuesta correcta: ' + (q.c + 1) + ' · ' + COLORES[q.c] + '. ' + (S.rapidez ? 'Pulsa el nombre de quien haya fallado para marcarlo en rojo.' : 'Pulsa el nombre de quien haya acertado.');
      botones = '<button type="button" class="principal" data-acc="cerrar" data-principal>' + (S.desempate ? 'Continuar' : 'Ver marcador') + '</button>';
    }
    return barra(titulo, detalle) +
      '<main class="escenario"><p class="enunciado">' + esc(q.p) + '</p>' + centro + vistaOpciones(q, revelada) + '</main>' +
      '<section class="mesa" aria-label="Mesa del profesor"><p class="mesa-ayuda">' + ayuda + '</p>' + vistaChips() +
      '<div class="mesa-botones">' + botones + '</div></section>';
  }

  function vistaMarcador() {
    var r = ranking(), max = Math.max(1, r.length ? r[0].puntos : 1), ultima = S.i + 1 >= S.cola.length;
    var filas = r.slice(0, 5).map(function (j, i) {
      var antes = S.rankAnt.indexOf(j.id), sube = antes > i ? '<span class="sube" aria-label="sube ' + (antes - i) + '">▲' + (antes - i) + '</span>' : '';
      var d = S.ultimos[j.id];
      return '<div class="fila-marcador"><span class="barra-pts" style="width:' + (j.puntos / max * 100) + '%"></span>' +
        '<span class="pos">' + (i + 1) + '.º</span><span class="nom">' + esc(j.nombre) + sube + '</span>' +
        '<span class="pts">' + num(j.puntos) + (d ? '<span class="delta">+' + num(d) + '</span>' : '') + '</span></div>';
    }).join('');
    var resto = r.length > 5 ? '<details class="resto"><summary>Ver al resto (' + (r.length - 5) + ')</summary><ol start="6">' +
      r.slice(5).map(function (j) { return '<li>' + esc(j.nombre) + ' · ' + num(j.puntos) + '</li>'; }).join('') + '</ol></details>' : '';
    return barra('Marcador', 'tras la pregunta ' + (S.i + 1) + ' de ' + S.cola.length) +
      '<main class="marcador"><h2>Marcador</h2>' + filas + resto +
      '<div class="pie-acciones"><button type="button" class="principal" data-acc="siguiente" data-principal>' + (ultima ? 'Ver el podio' : 'Siguiente pregunta') + '</button></div></main>';
  }

  function vistaPodio() {
    var r = ranking(), e = empate();
    function peana(j, n) {
      if (!j) return '<div class="peana p' + n + '"></div>';
      var premio = !e && n === 1 ? '<small>+0,5 puntos</small>' : (!e && n === 2 ? '<small>+0,25 puntos</small>' : '');
      return '<div class="peana p' + n + '"><div class="quien">' + esc(j.nombre) + '</div><div class="cuantos">' + num(j.puntos) + ' puntos · ' + aciertos(j.aciertos) + '</div>' +
        '<div class="bloque">' + n + premio + '</div></div>';
    }
    var aviso = '';
    if (e) {
      var nombres = e.ids.map(function (id) { return esc(jug(id).nombre); }).join(', ');
      aviso = '<div class="aviso-empate" role="alert">Empate en el ' + e.puesto + '.º puesto entre ' + nombres + '. ' +
        (S.sinPreguntas ? 'No quedan preguntas de desempate: decididlo en clase.' : 'Hay que desempatar antes de dar los premios.') + '</div>';
    } else if (S.ganadorDesempate) {
      aviso = '<div class="aviso-empate">' + esc(S.ganadorDesempate) + ' gana el desempate (+1 punto).</div>';
    }
    var resto = r.length > 3 ? '<details class="resto"><summary>Clasificación completa</summary><ol>' +
      r.map(function (j) { return '<li>' + esc(j.nombre) + ' · ' + num(j.puntos) + ' puntos · ' + aciertos(j.aciertos) + '</li>'; }).join('') + '</ol></details>' : '';
    var botones = (e && !S.sinPreguntas ? '<button type="button" class="principal" data-acc="desempatar" data-principal>Pregunta de desempate</button>' : '') +
      '<button type="button" class="' + (e && !S.sinPreguntas ? 'sec' : 'principal') + '" data-acc="copiar"' + (e && !S.sinPreguntas ? '' : ' data-principal') + '>Copiar resultados</button>' +
      '<button type="button" class="sec" data-acc="imprimir">Imprimir clasificación</button>' +
      '<button type="button" class="peligro" data-acc="nueva">Nueva partida</button>';
    return barra('Resultado final') +
      '<main class="podio-zona"><h2>¡Podio!</h2><div class="podio">' + peana(r[1], 2) + peana(r[0], 1) + peana(r[2], 3) + '</div>' + aviso + resto +
      '<div class="pie-acciones">' + botones + '</div><p id="copiado" role="status" style="text-align:center"></p>' +
      '<textarea id="texto-resultados" hidden rows="8" style="width:100%;font:inherit;color:#1b2733"></textarea></main>';
  }

  function render() {
    var foco = document.activeElement && document.activeElement.getAttribute('data-chip');
    if (S.fase === 'config') app.innerHTML = vistaConfig();
    else if (S.fase === 'pregunta' || S.fase === 'revelada') app.innerHTML = vistaPregunta();
    else if (S.fase === 'marcador') app.innerHTML = vistaMarcador();
    else app.innerHTML = vistaPodio();
    if (S.fase === 'config') {
      var ta = document.getElementById('lista'), cuenta = document.getElementById('cuenta');
      var contar = function () { var n = ta.value.split('\n').filter(function (l) { return l.trim(); }).length; cuenta.textContent = n + (n === 1 ? ' participante' : ' participantes'); };
      ta.addEventListener('input', contar); contar();
    }
    if (foco) { var el = app.querySelector('[data-chip="' + foco + '"]'); if (el) el.focus(); }
    if (S.fase === 'pregunta' && !S.crono.agotado) iniciarReloj(); else pararReloj();
  }

  /* ------------------------------------------------------------ eventos */
  app.addEventListener('click', function (ev) {
    var chip = ev.target.closest('[data-chip]');
    if (chip) { pulsarChip(chip.getAttribute('data-chip')); return; }
    var b = ev.target.closest('[data-acc]');
    if (!b) return;
    var acc = b.getAttribute('data-acc');
    if (acc === 'empezar') empezar();
    else if (acc === 'tarjetas') imprimirTarjetas();
    else if (acc === 'revelar') revelar();
    else if (acc === 'mas10') { S.crono.limite += 10; S.crono.agotado = false; guardar(); render(); }
    else if (acc === 'correcta') contestar(true);
    else if (acc === 'incorrecta') contestar(false);
    else if (acc === 'cerrar') cerrarPregunta();
    else if (acc === 'siguiente') siguiente();
    else if (acc === 'desempatar') { var e = empate(); S.ganadorDesempate = null; S.desempate = { ids: e.ids, puesto: e.puesto }; preparar(); }
    else if (acc === 'copiar') copiar();
    else if (acc === 'imprimir') window.print();
    else if (acc === 'pantalla') pantallaCompleta();
    else if (acc === 'sonido') { sonido = !sonido; escribir(CLAVE_SONIDO, sonido ? 'si' : 'no'); render(); }
    else if (acc === 'terminar') { if (confirm('¿Terminar la partida y ver el podio con los puntos actuales?')) { pararReloj(); S.desempate = null; S.fase = 'podio'; guardar(); render(); } }
    else if (acc === 'nueva') { if (confirm('¿Empezar una partida nueva? Se borrarán los puntos de esta.')) { S = nuevo(S); guardar(); render(); } }
  });
  document.addEventListener('keydown', function (ev) {
    /* Espacio = botón principal (aunque el foco esté en un nombre). Intro conserva su función normal. */
    if (ev.key === ' ' && !ev.target.closest('textarea, input, select, summary')) {
      var p = app.querySelector('[data-principal]');
      if (p) { ev.preventDefault(); p.click(); }
    }
  });

  render();
})();
</script>
</body>
</html>
