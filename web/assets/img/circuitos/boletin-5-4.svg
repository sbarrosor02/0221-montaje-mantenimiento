<title id="title">Boletín 5, ejercicio 4: En fila, pero no en serie</title>
<desc id="desc">Fuente de 12 V con R1 de 3 ohmios arriba y R5 de 1 ohmio abajo. En el centro, R2 de 6, R3 de 12 y R4 de 4 ohmios están dibujadas en fila. Sus puntos de unión se conectan alternativamente al cable superior y al inferior.</desc>
