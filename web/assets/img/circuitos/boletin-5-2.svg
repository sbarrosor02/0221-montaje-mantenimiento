<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 391" role="img" aria-labelledby="title desc">
<title id="title">Boletín 5, ejercicio 2: Cortocircuito escondido y rama abierta</title>
<desc id="desc">Fuente de 24 V. En el cable superior, R1 de 4 ohmios y el paralelo de R2 de 12 y R3 de 6 ohmios. Después baja R4 de 8 ohmios, cuyo extremo inferior se une con un cable que vuelve a subir al cable superior. R5 de 100 ohmios baja y termina en un extremo libre. R6 de 4 ohmios baja por la derecha hasta el cable de retorno.</desc>
