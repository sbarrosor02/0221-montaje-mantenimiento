<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" role="img" aria-labelledby="title desc">
<title id="title">Boletín 2, ejercicio 1: intensidad de 60 mA</title>
<desc id="desc">1 kiloohmio y 3 kiloohmios en serie con dos ramas: 8,2 más 160 ohmios, y 16 más 75 ohmios más el paralelo de 82 y 150 ohmios. El retorno incluye el paralelo de 51 y 130 ohmios.</desc>
<style>.wire{fill:none;stroke:#24364a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.source{fill:white;stroke:#24364a;stroke-width:2.5}.node{fill:#24364a}text{font:18px sans-serif;fill:#24364a}</style>
<rect width="100%" height="100%" fill="white"/>
<path class="wire" transform="translate(240.0,70.0) rotate(0.0)" d="M-140.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H140.0"/>
<text x="240.0" y="50.0" text-anchor="middle">3 kΩ</text>
<path class="wire" transform="translate(100.0,150.0) rotate(90.0)" d="M-80.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H80.0"/>
<text x="120.0" y="156.0" text-anchor="start">1 kΩ</text>
