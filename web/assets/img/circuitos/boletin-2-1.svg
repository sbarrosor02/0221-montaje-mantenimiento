<text x="400.0" y="166.0" text-anchor="start">8,2 Ω</text>
<path class="wire" transform="translate(380.0,340.0) rotate(90.0)" d="M-90.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H90.0"/>
<text x="400.0" y="346.0" text-anchor="start">160 Ω</text>
<polyline class="wire" points="380,430 380,480 650,480 650,430"/>
<path class="wire" transform="translate(515.0,70.0) rotate(0.0)" d="M-135.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H135.0"/>
<text x="515.0" y="50.0" text-anchor="middle">16 Ω</text>
<path class="wire" transform="translate(650.0,160.0) rotate(90.0)" d="M-90.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H90.0"/>
<text x="670.0" y="166.0" text-anchor="start">75 Ω</text>
<polyline class="wire" points="570,250 750,250"/>
<path class="wire" transform="translate(570.0,340.0) rotate(90.0)" d="M-90.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H90.0"/>
<text x="590.0" y="346.0" text-anchor="start">82 Ω</text>
<path class="wire" transform="translate(750.0,340.0) rotate(90.0)" d="M-90.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H90.0"/>
