<path class="wire" d="M95.0,295.0 h10 M100.0,290.0 v10 M95.0,315.0 h10"/>
<text x="66.0" y="311.0" text-anchor="end">? V</text>
<polyline class="wire" points="100,380 100,480 170,480"/>
