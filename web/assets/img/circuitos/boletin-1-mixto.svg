<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">Boletín 1, ejercicio 10: fuente de 45 V</title>
<desc id="desc">La resistencia de 1,5 ohmios está en serie con tres ramas: 6,2 ohmios; 120 ohmios; y 3,3 ohmios en serie con el paralelo de 820 y 430 ohmios.</desc>
