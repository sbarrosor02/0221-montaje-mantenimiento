<text x="270.0" y="211.0" text-anchor="start">430 Ω</text>
<path class="wire" transform="translate(420.0,140.0) rotate(90.0)" d="M-70.0,0 H-30 L-25,-9 L-15,9 L-5,-9 L5,9 L15,-9 L25,9 L30,0 H70.0"/>
<text x="440.0" y="146.0" text-anchor="start">1,5 Ω</text>
<g transform="translate(420.0,275.0) rotate(90.0)"><path class="wire" d="M-65.0,0 H-24 M24,0 H65.0"/><circle class="source" r="24"/></g>
<path class="wire" d="M415.0,265.0 h10 M420.0,260.0 v10 M415.0,285.0 h10"/>
