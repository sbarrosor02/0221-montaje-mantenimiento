<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 260" role="img" aria-labelledby="title desc">
<title id="title">Boletín 4, ejercicio 3: Fuente desconocida y unidades mezcladas</title>
<desc id="desc">Fuente desconocida con una corriente total de 5 mA. R1 de 1,2 kiloohmios en serie con dos ramas en paralelo (R2 de 2,2 más R3 de 1,8 kiloohmios; y R4 de 1 kiloohmio más el paralelo de R5 de 6 y R6 de 3 kiloohmios más R7 de 1 kiloohmio) y en serie con R8 de 800 ohmios.</desc>
