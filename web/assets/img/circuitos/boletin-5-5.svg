<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 781 422" role="img" aria-labelledby="title desc">
<title id="title">Boletín 5, ejercicio 5: Diagonales cruzadas y fuentes enfrentadas</title>
<desc id="desc">Dos fuentes, de 36 V y de 6 V, enfrentadas en el lado izquierdo, con R1 de 2 ohmios en el cable inferior. Rectángulo con R2 de 8 ohmios arriba, R3 de 12 ohmios a la derecha y un cable abajo. Dos diagonales, R4 y R5 de 6 ohmios, se cruzan en el centro sin punto de conexión.</desc>
