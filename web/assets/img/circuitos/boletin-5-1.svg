<title id="title">Boletín 5, ejercicio 1: La rama que parece paralela</title>
<desc id="desc">Fuente de 18 V y R1 de 3 ohmios en el cable superior. Del cable superior bajan R2 de 6 ohmios en vertical, R3 de 6 ohmios en diagonal y R4 de 12 ohmios en vertical. En el cable inferior, entre la bajada de R2 y la de R3, está R5 de 2 ohmios.</desc>
