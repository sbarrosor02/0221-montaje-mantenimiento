<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 422" role="img" aria-labelledby="title desc">
<title id="title">Boletín 5, ejercicio 3: La falsa estrella</title>
<desc id="desc">Fuente de 18 V. Triángulo con R2 de 12 ohmios en el lado superior, R4 de 8 ohmios en el lado derecho y R5 de 12 ohmios en el izquierdo. Desde un punto central salen R3 de 6 ohmios hacia el vértice derecho y R6 de 6 ohmios hacia el inferior. Un cable une el punto central con el cable de la fuente y cruza R5 sin punto de conexión. R1 de 3 ohmios está en el cable inferior.</desc>
