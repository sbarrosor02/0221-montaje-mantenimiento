<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 555 250" role="img" aria-labelledby="title desc">
<title id="title">Circuito lógico 6</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: AND de A y B; Puerta 2: AND de A y C; Puerta 3: AND de B y C; Puerta 4: OR de la salida de la puerta 1 y la salida de la puerta 2; Puerta 5: OR de la salida de la puerta 4 y la salida de la puerta 3. F es la salida de la puerta 5. Un cruce con salto indica que los cables no están unidos.</desc>
