<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 550 210" role="img" aria-labelledby="title desc">
<title id="title">Circuito lógico 4</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: NOT de B; Puerta 2: AND de A y la salida de la puerta 1; Puerta 3: NAND de la salida de la puerta 2 y la salida de la puerta 1; Puerta 4: OR de la salida de la puerta 1 y C; Puerta 5: NOR de la salida de la puerta 3 y la salida de la puerta 4. F es la salida de la puerta 5. Un cruce con salto indica que los cables no están unidos.</desc>
