<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 370 170" role="img" aria-labelledby="title desc">
<title id="title">Ejemplo resuelto de circuito lógico</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: OR de A y B; Puerta 2: NOT de C; Puerta 3: AND de la salida de la puerta 1 y la salida de la puerta 2. F es la salida de la puerta 3. Un cruce con salto indica que los cables no están unidos.</desc>
<style>.wire{fill:none;stroke:#24364a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gate{fill:white;stroke:#24364a;stroke-width:2.2;stroke-linejoin:round}.node{fill:#24364a}.open{fill:white;stroke:#24364a;stroke-width:2}text{font:16px sans-serif;fill:#24364a}.dato{font-weight:700;fill:#8a3d00}</style>
<rect x="-10" width="100%" height="100%" fill="white"/>
<path class="wire" d="M30,40 L120,40"/>
<path class="wire" d="M30,80 L100,80"/>
<path class="wire" d="M100,80 L100,60"/>
<path class="wire" d="M100,60 L120,60"/>
<path class="wire" d="M30,140 L120,140"/>
<path class="wire" d="M170,50 L200,50"/>
<path class="wire" d="M200,50 L200,85"/>
<path class="wire" d="M200,85 L240,85"/>
<path class="wire" d="M160,140 L210,140"/>
<path class="wire" d="M210,140 L210,105"/>
<path class="wire" d="M210,105 L240,105"/>
<path class="wire" d="M290,95 L320,95"/>
<path class="gate" d="M116,32 Q128,50 116,68 Q148,68 170,50 Q148,32 116,32 Z"/>
<path class="wire" d="M120,40 h4"/>
<path class="wire" d="M120,60 h4"/>
<path class="gate" d="M120,127 L150,140 L120,153 Z"/>
<circle class="gate" cx="154" cy="140" r="4"/>
<path class="gate" d="M240,77 H265 A25,18 0 0 1 265,113 H240 Z"/>
<circle class="open" cx="30" cy="40" r="4"/>
<text class="dato" x="22" y="45" text-anchor="end">A</text>
<circle class="open" cx="30" cy="80" r="4"/>
<text class="dato" x="22" y="85" text-anchor="end">B</text>
<circle class="open" cx="30" cy="140" r="4"/>
<text class="dato" x="22" y="145" text-anchor="end">C</text>
<text class="dato" x="328" y="100">F</text>
</svg>
