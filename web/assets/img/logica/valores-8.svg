<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 500 190" role="img" aria-labelledby="title desc">
<title id="title">Circuito 5.8</title>
<desc id="desc">Circuito combinacional con entradas A, B y salida F. Puerta 1: NAND de A y B; Puerta 2: NAND de A y la salida de la puerta 1; Puerta 3: NAND de la salida de la puerta 1 y B; Puerta 4: NAND de la salida de la puerta 2 y la salida de la puerta 3. F es la salida de la puerta 4. Un cruce con salto indica que los cables no están unidos.</desc>
