<path class="gate" d="M246,77 Q258,95 246,113 Q278,113 300,95 Q278,77 246,77 Z"/>
<path class="wire" d="M250,85 h4"/>
<path class="wire" d="M250,105 h4"/>
<circle class="open" cx="30" cy="40" r="4"/>
<text class="dato" x="22" y="45" text-anchor="end">A</text>
<circle class="open" cx="30" cy="90" r="4"/>
<text class="dato" x="22" y="95" text-anchor="end">B</text>
