<text class="dato" x="338" y="100">F</text>
<g class="puerta-num" data-g="G1"><circle cx="165" cy="18" r="9"/><text x="165" y="22" text-anchor="middle">1</text></g>
<g class="puerta-num" data-g="G2"><circle cx="156" cy="114" r="9"/><text x="156" y="118" text-anchor="middle">2</text></g>
<g class="puerta-num" data-g="G3"><circle cx="275" cy="63" r="9"/><text x="275" y="67" text-anchor="middle">3</text></g>
