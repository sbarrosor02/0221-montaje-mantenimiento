<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 380 170" role="img" aria-labelledby="title desc">
<title id="title">Circuito 5.3</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: AND de A y B; Puerta 2: NOT de C; Puerta 3: OR de la salida de la puerta 1 y la salida de la puerta 2. F es la salida de la puerta 3. Un cruce con salto indica que los cables no están unidos.</desc>
<style>.wire{fill:none;stroke:#24364a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gate{fill:white;stroke:#24364a;stroke-width:2.2;stroke-linejoin:round}.node{fill:#24364a}.open{fill:white;stroke:#24364a;stroke-width:2}text{font:16px sans-serif;fill:#24364a}.dato{font-weight:700;fill:#8a3d00}</style>
<style>.puerta-num circle{fill:#e8f1f9;stroke:#1f5c8f;stroke-width:1.5}.puerta-num text{font:bold 12px sans-serif;fill:#1f5c8f}.valor{font:bold 15px sans-serif;fill:#b4232c}</style>
<rect x="-10" width="100%" height="100%" fill="white"/>
