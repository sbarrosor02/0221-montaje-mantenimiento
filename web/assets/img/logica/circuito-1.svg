<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 540 220" role="img" aria-labelledby="title desc">
<title id="title">Circuito lógico 1</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: NOT de A; Puerta 2: AND de la salida de la puerta 1 y B; Puerta 3: NOR de B y C; Puerta 4: NOT de C; Puerta 5: AND de la salida de la puerta 3 y la salida de la puerta 4; Puerta 6: OR de la salida de la puerta 2 y la salida de la puerta 5. F es la salida de la puerta 6. Un cruce con salto indica que los cables no están unidos.</desc>
