<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 440 210" role="img" aria-labelledby="title desc">
<title id="title">Circuito 5.4</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: NOT de B; Puerta 2: OR de A y la salida de la puerta 1; Puerta 3: OR de B y C; Puerta 4: AND de la salida de la puerta 2 y la salida de la puerta 3. F es la salida de la puerta 4. Un cruce con salto indica que los cables no están unidos.</desc>
