<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 470 230" role="img" aria-labelledby="title desc">
<title id="title">Circuito lógico 5</title>
<desc id="desc">Circuito combinacional con entradas A, B y salida F. Puerta 1: NOT de A; Puerta 2: NOT de B; Puerta 3: AND de A y la salida de la puerta 2; Puerta 4: AND de la salida de la puerta 1 y B; Puerta 5: OR de la salida de la puerta 3 y la salida de la puerta 4. F es la salida de la puerta 5. Un cruce con salto indica que los cables no están unidos.</desc>
<style>.wire{fill:none;stroke:#24364a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gate{fill:white;stroke:#24364a;stroke-width:2.2;stroke-linejoin:round}.node{fill:#24364a}.open{fill:white;stroke:#24364a;stroke-width:2}text{font:16px sans-serif;fill:#24364a}.dato{font-weight:700;fill:#8a3d00}</style>
