<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 570 300" role="img" aria-labelledby="title desc">
<title id="title">Circuito lógico 2</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: AND de A y B; Puerta 2: NOT de B; Puerta 3: OR de C y B; Puerta 4: AND de la salida de la puerta 2 y la salida de la puerta 3; Puerta 5: OR de la salida de la puerta 1 y la salida de la puerta 4. F es la salida de la puerta 5. Un cruce con salto indica que los cables no están unidos.</desc>
