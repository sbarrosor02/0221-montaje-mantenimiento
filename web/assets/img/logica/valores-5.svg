<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 400 180" role="img" aria-labelledby="title desc">
<title id="title">Circuito 5.5</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: NAND de A y B; Puerta 2: NOR de la salida de la puerta 1 y C. F es la salida de la puerta 2. Un cruce con salto indica que los cables no están unidos.</desc>
