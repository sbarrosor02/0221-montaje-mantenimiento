<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 540 190" role="img" aria-labelledby="title desc">
<title id="title">Circuito 5.7</title>
<desc id="desc">Circuito combinacional con entradas A, B, C y salida F. Puerta 1: AND de A y C; Puerta 2: NOT de B; Puerta 3: XOR de B y C; Puerta 4: OR de la salida de la puerta 1 y la salida de la puerta 2; Puerta 5: AND de la salida de la puerta 4 y la salida de la puerta 3. F es la salida de la puerta 5. Un cruce con salto indica que los cables no están unidos.</desc>
