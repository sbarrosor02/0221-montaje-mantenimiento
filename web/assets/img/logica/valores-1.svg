<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 320 130" role="img" aria-labelledby="title desc">
<title id="title">Circuito 5.1</title>
<desc id="desc">Circuito combinacional con entradas A, B y salida F. Puerta 1: AND de A y B; Puerta 2: NOT de la salida de la puerta 1. F es la salida de la puerta 2. Un cruce con salto indica que los cables no están unidos.</desc>
<style>.wire{fill:none;stroke:#24364a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gate{fill:white;stroke:#24364a;stroke-width:2.2;stroke-linejoin:round}.node{fill:#24364a}.open{fill:white;stroke:#24364a;stroke-width:2}text{font:16px sans-serif;fill:#24364a}.dato{font-weight:700;fill:#8a3d00}</style>
<style>.puerta-num circle{fill:#e8f1f9;stroke:#1f5c8f;stroke-width:1.5}.puerta-num text{font:bold 12px sans-serif;fill:#1f5c8f}.valor{font:bold 15px sans-serif;fill:#b4232c}</style>
<rect x="-10" width="100%" height="100%" fill="white"/>
<path class="wire" d="M30,40 L90,40"/>
<path class="wire" d="M90,40 L90,50"/>
<path class="wire" d="M90,50 L120,50"/>
<path class="wire" d="M30,100 L100,100"/>
<path class="wire" d="M100,100 L100,70"/>
<path class="wire" d="M100,70 L120,70"/>
<path class="wire" d="M170,60 L200,60"/>
<path class="wire" d="M240,60 L270,60"/>
<path class="gate" d="M120,42 H145 A25,18 0 0 1 145,78 H120 Z"/>
<path class="gate" d="M200,47 L230,60 L200,73 Z"/>
<circle class="gate" cx="234" cy="60" r="4"/>
<circle class="open" cx="30" cy="40" r="4"/>
<text class="dato" x="22" y="45" text-anchor="end">A</text>
<circle class="open" cx="30" cy="100" r="4"/>
<text class="dato" x="22" y="105" text-anchor="end">B</text>
<text class="dato" x="278" y="65">F</text>
<g class="puerta-num" data-g="G1"><circle cx="145" cy="28" r="9"/><text x="145" y="32" text-anchor="middle">1</text></g>
<g class="puerta-num" data-g="G2"><circle cx="216" cy="34" r="9"/><text x="216" y="38" text-anchor="middle">2</text></g>
<text class="valor" data-in="A" x="38" y="34"></text>
<text class="valor" data-in="B" x="38" y="94"></text>
</svg>
